[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stardataparadise-sdk"
version = "0.2.0"
description = "Independent StarDataParadise wire v1 Python DB-API provider"
readme = "BUILD.md"
requires-python = ">=3.12"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stardataparadise_sdk = ["contracts/sdp-contract-v1.zip"]